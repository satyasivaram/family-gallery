}

.gallery-section h2{
    font-size:40px;
    margin-bottom:40px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card h3{
    padding:14px;
}
.instagram{

    margin:50px;
    padding:40px;
    border-radius:30px;
    text-align:center;
}
    .instagram h2{

    font-size:35px;
}

    line-height:30px;
    margin-bottom:25px;
}

.instagram a{

    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:8px;
    font-size:20px;
}
